<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guitarist Idle Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                url("/backgrounds/WHostBG.jpg")
                center / cover
                no-repeat fixed;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            color: white;
        }

        h1 {
            margin-bottom: 30px;
        }

        #previewArea {
            width: 90vw;
            height: 70vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: rgba(0, 0, 0, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;

            overflow: hidden;
        }

        #guitarist {
            width: 401px;
            height: 870px;

            background-image:
                url("/characters/animations/guitaristidle.png");

            background-repeat: no-repeat;
            background-position: 0 0;

            /*
                6 frames
                401px per frame
                6 × 401 = 2406px
            */

            animation:
                guitaristIdle 1.5s steps(6) infinite;

            transform: scale(0.5);
            transform-origin: center center;
        }

        @keyframes guitaristIdle {

            from {
                background-position: 0 0;
            }

            to {
                background-position: -2406px 0;
            }

        }

        #controls {
            margin-top: 25px;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        input {
            width: 250px;
        }

        #info {
            margin-top: 15px;
            opacity: 0.8;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>The Guitarist — Idle Animation Test</h1>

    <div id="previewArea">
        <div id="guitarist"></div>
    </div>

    <div id="controls">

        <label>
            Animation Speed:

            <input
                id="speed"
                type="range"
                min="0.2"
                max="3"
                step="0.1"
                value="1.5"
            >

            <span id="speedValue">1.5s</span>
        </label>

        <label>
            Scale:

            <input
                id="scale"
                type="range"
                min="0.1"
                max="1"
                step="0.05"
                value="0.5"
            >

            <span id="scaleValue">0.5x</span>
        </label>

        <div id="info">
            6 frames • 401 × 870px per frame
        </div>

    </div>


    <script>

        const guitarist =
            document.getElementById("guitarist");

        const speed =
            document.getElementById("speed");

        const speedValue =
            document.getElementById("speedValue");

        const scale =
            document.getElementById("scale");

        const scaleValue =
            document.getElementById("scaleValue");


        // -------------------------
        // SPEED
        // -------------------------

        speed.addEventListener("input", () => {

            const value =
                parseFloat(speed.value);

            guitarist.style.animationDuration =
                value + "s";

            speedValue.textContent =
                value.toFixed(1) + "s";

        });


        // -------------------------
        // SCALE
        // -------------------------

        scale.addEventListener("input", () => {

            const value =
                parseFloat(scale.value);

            guitarist.style.transform =
                `scale(${value})`;

            scaleValue.textContent =
                value.toFixed(2) + "x";

        });

    </script>

</body>
</html>
