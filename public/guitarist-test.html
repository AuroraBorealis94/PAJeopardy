<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guitarist Idle Test</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                url("/backgrounds/WHostBG.jpg")
                center / cover
                no-repeat fixed;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            color: white;
        }

        h1 {
            margin-bottom: 20px;
        }

        #previewArea {
            width: 90vw;
            height: 70vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: rgba(0, 0, 0, 0.35);

            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 20px;

            overflow: hidden;
        }


        /*
        ==========================================
        DEBUG IMAGE
        ==========================================
        */

        #debugImage {

            width: 500px;
            height: auto;

            max-width: 80vw;

            border: 3px solid red;

            display: block;
        }


        /*
        ==========================================
        SPRITE
        ==========================================
        */

        #guitarist {

            width: 401px;
            height: 870px;

            background-image:
                url("/characters/animations/guitaristidle.png");

            background-repeat: no-repeat;

            background-position: 0 0;

            animation:
                guitaristIdle 1.8s steps(6) infinite;

            transform: scale(0.5);

            transform-origin: center center;
        }


        @keyframes guitaristIdle {

            from {
                background-position: 0 0;
            }

            to {
                background-position: -2406px 0;
            }

        }


        #controls {

            margin-top: 20px;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 10px;
        }


        input {
            width: 250px;
        }


        #info {

            margin-top: 10px;

            opacity: 0.8;

            text-align: center;
        }

    </style>
</head>


<body>

    <h1>The Guitarist — Idle Animation Test</h1>


    <div id="previewArea">

        <!--
        TEMPORARY DEBUG IMAGE

        If this image DOES NOT appear,
        the problem is the server/path.

        If this image DOES appear,
        the problem is the sprite CSS.
        -->

        <img
            id="debugImage"
            src="/characters/animations/guitaristidle.png"
            alt="Guitarist spritesheet"
        >

    </div>


    <div id="controls">

        <label>
            Animation Speed:

            <input
                id="speed"
                type="range"
                min="0.2"
                max="4"
                step="0.1"
                value="1.8"
            >

            <span id="speedValue">1.8s</span>
        </label>


        <label>
            Scale:

            <input
                id="scale"
                type="range"
                min="0.1"
                max="1"
                step="0.05"
                value="0.5"
            >

            <span id="scaleValue">0.50x</span>
        </label>


        <div id="info">
            Spritesheet: 2406 × 870<br>
            6 frames × 401 × 870
        </div>

    </div>


    <script>

        const debugImage =
            document.getElementById("debugImage");

        const speed =
            document.getElementById("speed");

        const speedValue =
            document.getElementById("speedValue");

        const scale =
            document.getElementById("scale");

        const scaleValue =
            document.getElementById("scaleValue");


        /*
        ==========================================
        CHECK IMAGE LOAD
        ==========================================
        */

        debugImage.addEventListener("load", () => {

            console.log(
                "GUITARIST IMAGE LOADED:",
                debugImage.naturalWidth,
                "x",
                debugImage.naturalHeight
            );

        });


        debugImage.addEventListener("error", () => {

            console.error(
                "FAILED TO LOAD GUITARIST IMAGE"
            );

            document.getElementById("info").innerHTML =
                "<strong style='color:red'>" +
                "IMAGE FAILED TO LOAD" +
                "</strong><br>" +
                "Check the server path and console.";

        });


        /*
        ==========================================
        SPEED
        ==========================================
        */

        speed.addEventListener("input", () => {

            const value =
                parseFloat(speed.value);

            speedValue.textContent =
                value.toFixed(1) + "s";

            document.getElementById("guitarist")
                ?.style.setProperty(
                    "animation-duration",
                    value + "s"
                );

        });


        /*
        ==========================================
        SCALE
        ==========================================
        */

        scale.addEventListener("input", () => {

            const value =
                parseFloat(scale.value);

            scaleValue.textContent =
                value.toFixed(2) + "x";

            document.getElementById("guitarist")
                ?.style.setProperty(
                    "transform",
                    `scale(${value})`
                );

        });

    </script>

</body>
</html>
