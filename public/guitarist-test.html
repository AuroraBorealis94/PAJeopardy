<title>Caity Satyr Idle Test</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        background:
            url("/backgrounds/WHostBG.jpg")
            center / cover
            no-repeat fixed;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        font-family: Arial, sans-serif;
        color: white;
    }

    h1 {
        margin-bottom: 20px;
    }

    #previewArea {
        width: 90vw;
        height: 70vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background: rgba(0, 0, 0, 0.35);

        border: 2px solid rgba(255, 255, 255, 0.5);
        border-radius: 20px;

        overflow: hidden;
    }

    /*
    ==========================================
    SPRITE
    ==========================================
    */

    #caitysatyr {
        width: 401px;
        height: 870px;

        background-image:
            url("/characters/animations/caitysatyridle.png");

        background-repeat: no-repeat;
        background-position: 0 0;

        animation:
            caitysatyrIdle 1.8s steps(6) infinite;

        transform: scale(0.5);
        transform-origin: center center;

        image-rendering: auto;
    }

    @keyframes caitysatyrIdle {

        from {
            background-position: 0 0;
        }

        to {
            background-position: -2406px 0;
        }

    }


    /*
    ==========================================
    CONTROLS
    ==========================================
    */

    #controls {
        margin-top: 20px;

        display: flex;
        flex-direction: column;
        align-items: center;

        gap: 10px;
    }

    input {
        width: 250px;
    }

    #info {
        margin-top: 10px;

        opacity: 0.8;

        text-align: center;
    }

</style>
```

</head>

<body>

```
<h1>Caity Satyr — Idle Animation Test</h1>


<div id="previewArea">

    <div id="caitysatyr"></div>

</div>


<div id="controls">

    <label>
        Animation Speed:

        <input
            id="speed"
            type="range"
            min="0.2"
            max="4"
            step="0.1"
            value="1.8"
        >

        <span id="speedValue">1.8s</span>
    </label>


    <label>
        Scale:

        <input
            id="scale"
            type="range"
            min="0.1"
            max="1"
            step="0.05"
            value="0.5"
        >

        <span id="scaleValue">0.50x</span>
    </label>


    <div id="info">
        Spritesheet: 2406 × 870<br>
        6 frames × 401 × 870
    </div>

</div>


<script>

    const caitysatyr =
        document.getElementById("caitysatyr");

    const speed =
        document.getElementById("speed");

    const speedValue =
        document.getElementById("speedValue");

    const scale =
        document.getElementById("scale");

    const scaleValue =
        document.getElementById("scaleValue");


    /*
    ==========================================
    SPEED CONTROL
    ==========================================
    */

    speed.addEventListener("input", () => {

        const value =
            parseFloat(speed.value);

        speedValue.textContent =
            value.toFixed(1) + "s";

        caitysatyr.style.animationDuration =
            value + "s";

    });


    /*
    ==========================================
    SCALE CONTROL
    ==========================================
    */

    scale.addEventListener("input", () => {

        const value =
            parseFloat(scale.value);

        scaleValue.textContent =
            value.toFixed(2) + "x";

        caitysatyr.style.transform =
            `scale(${value})`;

    });

</script>
```

</body>
