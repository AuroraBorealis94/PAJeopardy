<title>Guitarist Idle Test</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        background:
            url("/backgrounds/WHostBG.jpg")
            center / cover
            no-repeat fixed;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        font-family: Arial, sans-serif;
        color: white;
    }

    h1 {
        margin-bottom: 30px;
    }

    #previewArea {
        width: 90vw;
        height: 70vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background: rgba(0, 0, 0, 0.35);
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-radius: 20px;

        overflow: hidden;
    }

    #guitarist {
        background-image: url("/characters/animations/guitaristidle.png");
        background-repeat: no-repeat;

        /* JS will set these automatically */
        width: 100px;
        height: 100px;

        image-rendering: auto;

        animation-name: guitaristIdle;
        animation-timing-function: steps(4);
        animation-iteration-count: infinite;
    }

    @keyframes guitaristIdle {
        from {
            background-position: 0 0;
        }

        to {
            background-position: var(--end-position) 0;
        }
    }

    #controls {
        margin-top: 25px;

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }

    input {
        width: 250px;
    }

    #info {
        margin-top: 15px;
        opacity: 0.8;
        text-align: center;
    }
</style>
```

</head>

<body>

```
<h1>The Guitarist — Idle Animation Test</h1>

<div id="previewArea">
    <div id="guitarist"></div>
</div>

<div id="controls">

    <label>
        Animation Speed:
        <input
            id="speed"
            type="range"
            min="0.1"
            max="2"
            step="0.1"
            value="0.8"
        >
        <span id="speedValue">0.8s</span>
    </label>

    <label>
        Scale:
        <input
            id="scale"
            type="range"
            min="0.5"
            max="5"
            step="0.1"
            value="2"
        >
        <span id="scaleValue">2x</span>
    </label>

    <div id="info"></div>

</div>
```

<script>

const sprite = document.getElementById("guitarist");
const speedSlider = document.getElementById("speed");
const scaleSlider = document.getElementById("scale");

const speedValue = document.getElementById("speedValue");
const scaleValue = document.getElementById("scaleValue");
const info = document.getElementById("info");

const FRAME_COUNT = 6;

const image = new Image();

image.src = "/characters/animations/guitaristidle.png";

image.onload = () => {

    /*
        Assuming the four animation frames are arranged
        horizontally across the spritesheet.
    */

    const frameWidth = image.naturalWidth / FRAME_COUNT;
    const frameHeight = image.naturalHeight;

    sprite.style.width = `${frameWidth}px`;
    sprite.style.height = `${frameHeight}px`;

    /*
        Move exactly one frame at a time.

        We don't want to move all the way to -totalWidth,
        because that would move the sprite completely
        off-screen on the final animation step.
    */

    const endPosition =
        -(frameWidth * (FRAME_COUNT - 1));

    sprite.style.setProperty(
        "--end-position",
        `${endPosition}px`
    );

    sprite.style.animationDuration =
        `${speedSlider.value}s`;

    sprite.style.transform =
        `scale(${scaleSlider.value})`;

    info.textContent =
        `Spritesheet: ${image.naturalWidth} × ${image.naturalHeight} | ` +
        `Frame: ${frameWidth} × ${frameHeight} | ` +
        `${FRAME_COUNT} frames`;
};


speedSlider.addEventListener("input", () => {

    const speed = speedSlider.value;

    speedValue.textContent = `${speed}s`;

    sprite.style.animationDuration = `${speed}s`;
});


scaleSlider.addEventListener("input", () => {

    const scale = scaleSlider.value;

    scaleValue.textContent = `${scale}x`;

    sprite.style.transform =
        `scale(${scale})`;
});

</script>

</body>
</html>
